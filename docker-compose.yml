services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-sports_dev_password}
      MYSQL_DATABASE: ${DB_NAME:-sports_platform}
    ports:
      - "3307:3306"
    volumes:
      - sports_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-sports_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sports_platform}
      DB_USER: root
      DB_PASS: ${DB_PASS:-sports_dev_password}
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-production}
      FRONTEND_ORIGIN: http://localhost:5174
      ENABLE_SCHEMA_SYNC: "true"
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3002"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3002
    ports:
      - "5174:5174"
    depends_on:
      - server

volumes:
  sports_mysql_data:
